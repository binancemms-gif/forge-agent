name = "forge-agent-api"
main = "worker/index.ts"
compatibility_date = "2026-09-25"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
# Set this to the deployed app origin, comma-separated for multiple origins.
ALLOWED_ORIGINS = ""
# Set secrets with `wrangler secret put GROQ_API_KEY`, `REDIS_URL`, `REDIS_TOKEN`, and `DATABASE_URL`.
# Secrets are intentionally not stored in this file.

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "forge-agent-artifacts"

[assets]
directory = "dist"

[observability]
enabled = true
